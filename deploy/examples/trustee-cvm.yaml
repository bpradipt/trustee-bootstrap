# The Trustee CVM (spec §7): one CoCo pod. The Bootstrap Helper init
# container collects the Shares and publishes Trustee's config tree into the
# memory-backed state volume; then the Trustee main container starts from it.
#
# Before you apply this file:
#
# 1. Create the two untrusted ConfigMaps:
#      kubectl create configmap trustee-ceremony-manifest --from-file=ceremony.json
#      kubectl create configmap trustee-sealed-bundle --from-file=bundle.age
# 2. Replace @HELPER_IMAGE@ with the Bootstrap Helper image, pinned by
#    digest (build it with cmd/bootstrap-helper/Containerfile).
# 3. Replace @MANIFEST_SHA256@ with the hex SHA-256 of ceremony.json
#    (`sha256sum ceremony.json`). The helper refuses to start when the
#    mounted manifest has another digest or the arg is missing (ADR 0007).
# 4. Run genpolicy (Kata 4.2.0) on this file with
#    --initdata-path=init-data.toml. It adds the Kata Agent policy to the
#    Init-Data and puts the Init-Data in the cc_init_data annotation. The
#    policy pins both images, the helper's args and the mounts, and denies
#    exec. Security Operators review the resulting Init-Data TOML and build
#    their Operator Policy from it.
apiVersion: v1
kind: Pod
metadata:
  name: trustee-cvm
  labels:
    app: trustee-cvm
  annotations:
    # The guest pulls and unpacks both images into its own memory; the KBS
    # image does not fit in a 1 GiB guest.
    io.katacontainers.config.hypervisor.default_memory: "2048"
spec:
  runtimeClassName: kata-qemu-coco-dev-tpm
  initContainers:
    - name: bootstrap-helper
      image: "@HELPER_IMAGE@"
      args:
        - --manifest=/bootstrap/manifest/ceremony.json
        - --manifest-sha256=@MANIFEST_SHA256@
        - --bundle=/bootstrap/bundle/bundle.age
        - --out=/trustee/config
        # Trustee's UID and GID own the published tree. The KBS image sets
        # no USER, so Trustee runs as root.
        - --owner-uid=0
        - --owner-gid=0
        - --listen=:8090
        - --proxy-port=8081
      ports:
        - containerPort: 8090
      volumeMounts:
        - name: manifest
          mountPath: /bootstrap/manifest
          readOnly: true
        - name: bundle
          mountPath: /bootstrap/bundle
          readOnly: true
        - name: state
          mountPath: /trustee
  containers:
    - name: trustee
      image: ghcr.io/confidential-containers/key-broker-service:built-in-as-v0.22.0@sha256:c1960cb4df0b1bdc0e4309f97dc65b0a1a777a92dabb2211acb45542f906c625
      command:
        - /usr/local/bin/kbs
        - --config-file
        - /trustee/config/kbs.toml
      ports:
        - containerPort: 8080
      readinessProbe:
        tcpSocket:
          port: 8080
      volumeMounts:
        - name: state
          mountPath: /trustee
  volumes:
    - name: manifest
      configMap:
        name: trustee-ceremony-manifest
    - name: bundle
      configMap:
        name: trustee-sealed-bundle
    # A tmpfs inside the guest. It holds the published tree and disappears
    # with the pod (ADR 0002).
    - name: state
      emptyDir:
        medium: Memory
---
# Security Operators reach the Bootstrap Helper here. The pod is not Ready
# while the init container runs, so the Service must publish not-ready
# addresses, and an init container's port can only be a number.
apiVersion: v1
kind: Service
metadata:
  name: trustee-bootstrap-helper
spec:
  type: NodePort
  selector:
    app: trustee-cvm
  publishNotReadyAddresses: true
  ports:
    - port: 8090
      targetPort: 8090
---
# Workloads reach the unlocked Trustee here, once the pod is Ready.
apiVersion: v1
kind: Service
metadata:
  name: trustee
spec:
  selector:
    app: trustee-cvm
  ports:
    - port: 8080
      targetPort: 8080
