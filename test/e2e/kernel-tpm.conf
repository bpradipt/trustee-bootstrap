# Added to Kata's x86_64 guest kernel fragments: TPM drivers for the swtpm
# that QEMU attaches (tpm-crb on q35, tpm-tis as fallback).
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y
CONFIG_TCG_CRB=y
# Session encryption to the TPM adds a key derivation at every boot and buys
# nothing against a host-side swtpm.
# CONFIG_TCG_TPM2_HMAC is not set
