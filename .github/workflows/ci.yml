# Every pull request runs the Go tests, the Go gate's checks and the swtpm
# end-to-end tests; a documentation-only PR skips the end-to-end tests. Each
# job calls test/e2e/ci.sh, so a developer can run the same steps.
# docs/ci.md lists the checks that branch protection must require.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet and go test
        run: test/e2e/ci.sh go
      # the Go gate's checks, with its pinned tools and limits.
      - name: lint
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: test/e2e/ci.sh lint "$BASE"
      # The release binaries, an SBOM for each, and SHA256SUMS.
      - name: release build and SBOM
        run: test/e2e/ci.sh release "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  # A pull request that changes only documentation skips e2e. GitHub counts
  # a skipped job as passing, so such a PR stays mergeable. Pushes to main
  # always run it.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      # A pull request checks out its merge commit; HEAD^1 is the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ $EVENT == pull_request ]]; then
            test/e2e/ci.sh needs-e2e HEAD^1 >>"$GITHUB_OUTPUT"
          else
            echo e2e=true >>"$GITHUB_OUTPUT"
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_ENGINE: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare the runner
        run: |
          # Let the runner user open /dev/kvm.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tcpdump
          df -h / && free -g && nproc
      # The scripts skip a build whose output exists, so a key must change
      # whenever a pin does: no restore-keys fallback to an older output.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trustee-bootstrap-e2e/out
          key: e2e-out-${{ hashFiles('test/e2e/kind-kata-swtpm.sh', 'test/e2e/kernel-tpm.conf', 'test/e2e/trustee-cvm.sh') }}
      # ci.sh e2e runs `up` too; running it here first lets the cache be
      # saved even when a test fails.
      - name: Build the swtpm environment
        run: test/e2e/kind-kata-swtpm.sh up
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trustee-bootstrap-e2e/out
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: swtpm end-to-end tests
        run: test/e2e/ci.sh e2e
