# Every pull request runs the Go tests, the Go gate's checks and the swtpm
# end-to-end tests. Each job calls test/e2e/ci.sh, so a developer can run the
# same steps.
# docs/ci.md lists the checks that branch protection must require.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet and go test
        run: test/e2e/ci.sh go
      # the Go gate's checks, with its pinned tools and limits.
      - name: lint
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: test/e2e/ci.sh lint "$BASE"

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_ENGINE: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare the runner
        run: |
          # Let the runner user open /dev/kvm.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tcpdump
          df -h / && free -g && nproc
      # The scripts skip a build whose output exists, so a key must change
      # whenever a pin does: no restore-keys fallback to an older output.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trustee-bootstrap-e2e/out
          key: e2e-out-${{ hashFiles('test/e2e/kind-kata-swtpm.sh', 'test/e2e/kernel-tpm.conf', 'test/e2e/trustee-cvm.sh') }}
      # ci.sh e2e runs `up` too; running it here first lets the cache be
      # saved even when a test fails.
      - name: Build the swtpm environment
        run: test/e2e/kind-kata-swtpm.sh up
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trustee-bootstrap-e2e/out
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: swtpm end-to-end tests
        run: test/e2e/ci.sh e2e
